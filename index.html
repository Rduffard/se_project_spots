<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Spots</title><meta name="description" content="Third project of Triple Ten"/><meta name="keywords" content="BEM, Responsive Design, Grid, Fonts"/><meta name="author" content="Romain Duffard"/><link rel="shortcut icon" href="./favicon.ico" type="image/x-icon"/><link rel="icon" href="/se_project_spots/favicon.ico"><script defer="defer" src="/se_project_spots/main.js"></script><link href="/se_project_spots/main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="/se_project_spots/80804e27ce061efd1ffb.svg" alt="Spot Logo" class="header__logo"/></header><main class="content"><section class="profile page__section"><div class="profile__avatar-containter"><button class="profile__avatar-btn"><img class="profile__avatar-btn-icon" src="/se_project_spots/d73f076c46eb5467f5fc.svg" alt="Pencil Icon" id="avatar-edit-button"/></button> <img src="/se_project_spots/2fc47fd8e9a9bcd9612f.jpg" alt="Bessie Avatar" class="profile__avatar"/></div><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-btn"><img src="/se_project_spots/49e44e5e03758262e8bf.svg" alt="Edit Button"/>Edit Profile</button></div><button type="button" class="profile__add-btn"><img src="/se_project_spots/975792ea68af0a3c209d.svg" alt="Plus Icon"/>New Post</button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><button type="button" class="card__delete-btn"></button> <img src="#" alt="" class="card__image"/><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-btn"></button></div></li></template></ul></section></main><footer class="footer"><p class="footer__copyright">2025 &copy; Spots</p></footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><button type="button" class="modal__close-btn"></button><h2 class="modal__title">Edit profile</h2><form class="modal__form" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" minlength="2" maxlength="40" required/> <span id="profile-name-input-error" class="modal__error"></span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="200" required/> <span id="profile-description-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><button type="button" class="modal__close-btn"></button><h2 class="modal__title">New post</h2><form class="modal__form" novalidate><label for="card-image-input" class="modal__label">Image link <input id="card-image-input" type="url" class="modal__input" placeholder="Paste a link to the picture" required/> <span id="card-image-input-error" class="modal__error"></span></label> <label for="card-caption-input" class="modal__label">Caption <input id="card-caption-input" class="modal__input" placeholder="Type your caption" minlength="2" maxlength="30" required/> <span id="card-caption-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal modal_type_preview" id="preview-modal"><div class="modal__image-container"><button type="button" class="modal__close-btn modal__close-btn_type_preview"></button> <img src="#" alt="" class="modal__image"/><p class="modal__caption"></p></div></div></div><div class="modal" id="avatar-modal"><div class="modal__container"><button type="button" class="modal__close-btn"></button><h2 class="modal__title">Select Profile Avatar</h2><form class="modal__form" novalidate id="edit-avatar-form"><label for="avatar-link-input" class="modal__label">Profile Picture <input id="avatar-link-input" type="url" name="avatar" class="modal__input" placeholder="Paste the link to an image" required/> <span id="avatar-link-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal" id="delete-modal"><div class="modal__container"><button type="button" class="modal__close-btn"></button><h2 class="modal__title">Are you sure you want to delete this image?</h2><form class="modal__form modal__form_delete" novalidates id="delete-form"><button type="submit" class="modal__submit-btn modal__delete-confirm">Delete</button> <button type="button" class="modal__submit-btn modal__delete-cancel">Cancel</button></form></div></div></body></html>
